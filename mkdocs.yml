# mkdocs.yml (English): generated by python/genera_sito.py from python/mkdocs_modello_en.yml (LINGUA=en).
# Do not edit mkdocs.yml by hand.
site_name: Approximation Algorithms · Fabio Furini
site_url: https://fabiofurini.github.io/approximation-algorithms/
site_description: >-
  Lecture notes on approximation algorithms: performance guarantees and how to prove them, algorithms, worst-case analyses and tight instances for knapsack, bin packing, the metric TSP and parallel machine scheduling, approximation schemes and the limits of approximation, with exercises, slides, Colab notebooks and interactive apps.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/approximation-algorithms
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/approximation-algorithms/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/approximately-equal
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: en

extra:
