      - "1. Principles": exercises/approximation.md
      - "Knapsack problems":
          - "2. 0/1 knapsack (KP)": exercises/knapsack-approximation.md
      - "Packing problems":
          - "3. Bin packing (BPP)": exercises/bin-packing-approximation.md
      - "Coloring problems":
          - "4. Vertex coloring (VCP)": exercises/coloring-inapproximability.md
      - "Clique problems":
          - "5. Maximum clique (MCP)": exercises/clique-inapproximability.md
      - "Routing problems":
          - "6. Travelling salesman (TSP)": exercises/tsp-approximation.md
      - "Scheduling problems":
          - "7. Identical parallel machines (P||Cmax)": exercises/pcmax-approximation.md
  - Quiz: self-assessment.md
  - Lab: lab/index.md
  - Downloads:
