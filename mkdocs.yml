      - "Packing problems":
          - "3. Bin packing (BPP)": bin-packing-approximation.md
      - "Coloring problems":
          - "4. Vertex coloring (VCP)": coloring-inapproximability.md
      - "Clique problems":
          - "5. Maximum clique (MCP)": clique-inapproximability.md
      - "Routing problems":
          - "6. Travelling salesman (TSP)": tsp-approximation.md
      - "Scheduling problems":
          - "7. Identical parallel machines (P||Cmax)": pcmax-approximation.md
  - Exercises:
